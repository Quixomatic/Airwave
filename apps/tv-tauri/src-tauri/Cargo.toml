[package]
name = "airwave"
version = "0.13.3"
description = "Airwave desktop client (Tauri + libmpv)"
authors = ["Airwave"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# The Tauri app library. `main.rs` calls `app_lib::run()`; keeping the lib name
# stable avoids touching the entry points. staticlib/cdylib are for the mobile
# targets, rlib for desktop.
[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["macos-private-api"] }
tauri-plugin-log = "2"
# HTTP from the webview without CORS (Airwave /api/v1 + device-code auth) — routed
# through Rust (@tauri-apps/plugin-http on the JS side).
tauri-plugin-http = "2"
# Persist + restore the window size/position/maximized state across launches.
tauri-plugin-window-state = "2"
# File-backed key-value store (server URL, token, settings) in the app-data dir —
# survives webview-cache clears; readable from Rust (@tauri-apps/plugin-store on JS).
tauri-plugin-store = "2"
# Self-update from the GitHub release's latest.json (signed with our minisign key).
tauri-plugin-updater = "2"
# Relaunch the app after an update installs.
tauri-plugin-process = "2"
tauri-plugin-os = "2"
# The native window handle (mpv `--wid` embed) + per-platform windowing.
raw-window-handle = "0.6"
# Enumerate LAN interfaces natively for onboarding's server scan — the webview's WebRTC
# subnet trick (tv-web) gets mDNS-obfuscated inside WebView2, so we read interfaces in Rust.
if-addrs = "0.13"
# Concurrent health probes in the server scan. reqwest comes from tauri-plugin-http (re-exported).
futures = "0.3"

# Windows: Win32 for the child-HWND video surface + WS_CLIPCHILDREN + resize.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

# macOS: objc2 for the mpv render target — a CAMetalLayer inserted behind the transparent WKWebView,
# passed to mpv as `wid` (the Metal-layer analog of the Windows HWND). Versions match soia's proven set.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.1"
objc2-app-kit = { version = "0.3.1", features = ["NSWindow", "NSView", "NSResponder"] }
objc2-foundation = { version = "0.3.1", features = ["NSString", "NSGeometry"] }
objc2-quartz-core = { version = "0.3.1", features = ["CALayer", "CAMetalLayer"] }

# Keep the machine + display awake while video plays (desktop only). Tauri has no first-class API
# (tauri#3697), so we mirror our Tauri+libmpv reference (soia): hold an OS wake assertion during playback.
# keepawake → IOPMAssertion (macOS) / SetThreadExecutionState (Windows) / D-Bus·systemd (Linux). Scoped to
# desktop so any mobile build (the staticlib/cdylib crate-types) doesn't try to pull it.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
keepawake = "0.6.0"
