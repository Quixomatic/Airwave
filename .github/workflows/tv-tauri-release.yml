name: TV Desktop (tv-tauri) Build & Release

# Builds the Airwave DESKTOP CLIENT (apps/tv-tauri, Tauri + libmpv) and attaches the installer +
# updater artifacts (latest.json + .sig) to the GitHub Release. Triggers on `v*` tags (same as the
# server's desktop-release.yml — a tag fires both) or manually.
#
# STATUS: WINDOWS (signed NSIS + updater) and macOS (Apple Silicon + Intel, .app/.dmg) are real builds.
# macOS is UNSIGNED for now — signing/notarization + a merged latest.json are the finalize pass (Phase
# 8C). LINUX stays a NO-OP until its X11/wayland embed lands. See .plans/tv-tauri.md Phase 8.
#
# The big libmpv runtime DLLs are NOT committed — this fetches them from the `libmpv-latest` release
# (built by libmpv-windows.yml) into vendor/. The tiny MSVC import lib (windows-x64/lib/mpv.lib) IS
# committed, so linking needs no dumpbin/lib dance on the runner.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the built artifacts to this EXISTING release tag (e.g. v0.11.50) — lets you (re)build with the latest workflow and land the installer on a release WITHOUT re-tagging or firing the other v* workflows. Leave blank to just build + upload artifacts."
        type: string
        default: ""

concurrency:
  group: tv-tauri-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # attach artifacts to the GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
            libmpv: windows-x64
            supported: true
          # macOS Apple Silicon — native build (render-attach = CAMetalLayer-as-wid). `updaterarch` is
          # the Tauri/darwin arch slug for latest.json (`darwin-aarch64` / `darwin-x86_64`); `target` is
          # empty → native aarch64.
          - os: macos-14
            arch: arm64
            libmpv: macos-arm64
            updaterarch: aarch64
            target: ""
            supported: true
          # macOS Intel — CROSS-COMPILED on the same Apple-Silicon runner (`--target x86_64-apple-darwin`).
          # macos-14 is always available + fast; the public macOS Intel (macos-13) runner queue is backed
          # up. The arm64 host links the x86_64 libmpv → an Intel .app (we bundle, never run it here).
          - os: macos-14
            arch: x64
            libmpv: macos-x64
            updaterarch: x86_64
            target: x86_64-apple-darwin
            supported: true
          # NO-OP until the Linux X11/wayland embed lands.
          - os: ubuntu-24.04
            arch: x64
            supported: false
    runs-on: ${{ matrix.os }}

    env:
      # `pnpm install` runs prisma generate across the monorepo; a throwaway URL satisfies it (never connects).
      DATABASE_URL: "postgresql://build:build@localhost:5432/build?schema=public"
      # `secrets` can't be used in a step `if:`, so evaluate signing availability once here.
      WIN_SIGN_AVAILABLE: ${{ secrets.AZURE_CREDENTIALS != '' }}
      MAC_SIGN_AVAILABLE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Not yet supported (${{ matrix.os }})
        if: ${{ !matrix.supported }}
        shell: bash
        run: echo "tv-tauri ${{ matrix.os }} is a no-op until its mpv render-attach lands (Phase 6). Skipping."

      - uses: pnpm/action-setup@v4
        if: matrix.supported
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        if: matrix.supported
        with:
          node-version: 22
          cache: pnpm

      - name: Rust toolchain
        if: matrix.supported
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        if: matrix.supported
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tv-tauri/src-tauri

      # Fetch the prebuilt libmpv runtime DLLs from the libmpv-latest release into vendor/<plat>/bin/.
      # (windows-x64/lib/mpv.lib is committed, so we only need the DLLs.)
      - name: Fetch libmpv runtime
        if: matrix.supported
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DEST="apps/tv-tauri/src-tauri/vendor/libmpv/${{ matrix.libmpv }}"
          # RELATIVE dirs + --force-local — a Windows drive path (D:\...) makes tar treat "D:" as a
          # remote host ("Cannot connect to D:"). Windows archive = bin/ (DLLs) + lib/mpv.lib; macOS
          # archive = lib/ (dylibs) only.
          mkdir -p "$DEST" _libmpv
          gh release download libmpv-latest --repo "$GITHUB_REPOSITORY" \
            --pattern "libmpv-airwave-${{ matrix.libmpv }}.tar.gz" --dir _libmpv
          # --force-local is a GNU-tar flag needed only on Windows git-bash (D:\ → host); macOS bsdtar
          # rejects it.
          if [ "$RUNNER_OS" = "Windows" ]; then FL="--force-local"; else FL=""; fi
          tar $FL -xzf "_libmpv/libmpv-airwave-${{ matrix.libmpv }}.tar.gz" -C _libmpv
          LIB_SRC="$(find _libmpv -type d -name lib | head -1)"
          [ -n "$LIB_SRC" ] || { echo "no lib/ in archive"; find _libmpv | head -40; exit 1; }
          rm -rf "$DEST/lib"; cp -r "$LIB_SRC" "$DEST/lib"
          BIN_SRC="$(find _libmpv -type d -name bin | head -1)"
          if [ -n "$BIN_SRC" ]; then rm -rf "$DEST/bin"; cp -r "$BIN_SRC" "$DEST/bin"; fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            ls "$DEST/lib/mpv.lib" >/dev/null || { echo "mpv.lib missing (re-run libmpv-windows.yml)"; ls "$DEST/lib"; exit 1; }
          else
            # macOS: the linker wants `libmpv.dylib`; symlink to the soname (`libmpv.2.dylib`).
            ( cd "$DEST/lib" && { [ -e libmpv.dylib ] || ln -s libmpv.*.dylib libmpv.dylib; } )
          fi
          echo "libmpv lib:"; ls "$DEST/lib" | head

      - name: Install dependencies
        if: matrix.supported
        run: pnpm install --frozen-lockfile

      # Build the NSIS installer + updater artifacts (createUpdaterArtifacts + the signing key produce
      # the .sig). The .sig here is over the UNSIGNED exe; it's regenerated after Azure signing below.
      - name: Build (Tauri NSIS + updater artifacts)
        if: matrix.supported && runner.os == 'Windows'
        working-directory: apps/tv-tauri
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: pnpm bundle:win

      - name: Azure login (for Windows signing)
        if: matrix.supported && runner.os == 'Windows' && env.WIN_SIGN_AVAILABLE == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Authenticode-sign the NSIS installer IN PLACE so Windows doesn't SmartScreen-warn "unknown
      # publisher" (reuses the server's Azure Artifact Signing account). Gated on the Azure secret.
      - name: Sign Windows installer (Azure Artifact Signing)
        if: matrix.supported && runner.os == 'Windows' && env.WIN_SIGN_AVAILABLE == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: airwave
          certificate-profile-name: airwave-ci-signing
          files-folder: ${{ github.workspace }}\apps\tv-tauri\src-tauri\target\release\bundle\nsis
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Regenerate the updater .sig OVER the now-signed installer (the build's .sig was over the unsigned
      # exe → would mismatch). Only when Azure signing actually ran.
      - name: Re-sign updater signature (over signed installer)
        if: matrix.supported && runner.os == 'Windows' && env.WIN_SIGN_AVAILABLE == 'true'
        working-directory: apps/tv-tauri
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          EXE="$(ls src-tauri/target/release/bundle/nsis/*_x64-setup.exe)"
          pnpm exec tauri signer sign -p "" "$EXE"

      # Stage the installer + .sig under a space-free name, and drop an updater FRAGMENT
      # (frag-windows-x86_64.json = {key,signature,url}) that the finalize job merges into one latest.json
      # spanning every platform. (Per-job latest.json would clobber the other platforms' entries.)
      - name: Stage installer + updater fragment (Windows)
        if: matrix.supported && runner.os == 'Windows'
        working-directory: apps/tv-tauri
        shell: bash
        run: |
          set -euo pipefail
          NSIS="src-tauri/target/release/bundle/nsis"
          OUT="artifacts"; mkdir -p "$OUT"
          VER="$(node -p "require('./package.json').version")"
          SRC_EXE="$(ls "$NSIS"/*_x64-setup.exe)"
          ASSET="Airwave-Client_${VER}_x64-setup.exe"
          cp "$SRC_EXE" "$OUT/$ASSET"
          cp "$SRC_EXE.sig" "$OUT/$ASSET.sig"
          export SIG="$(cat "$OUT/$ASSET.sig")"
          export URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${ASSET}"
          node -e "
            const fs=require('fs');
            fs.writeFileSync('artifacts/frag-windows-x86_64.json', JSON.stringify(
              {key:'windows-x86_64', signature:process.env.SIG, url:process.env.URL}));
          "
          cat artifacts/frag-windows-x86_64.json; echo

      # ── macOS (Apple Silicon native + Intel cross-compiled) — Phase 8. Build the .app ONLY, make it
      # self-contained by bundling the libmpv dylibs into Contents/Frameworks + flattening install_names
      # to @rpath, Developer-ID SIGN it (hardened runtime), build the DMG from the FIXED+SIGNED .app,
      # then NOTARIZE + staple. (Building `app,dmg` together packages the .app BEFORE the dylibs land →
      # broken DMG; signing must come AFTER the dylib surgery or the signature is invalid.) Signing is
      # gated on the Apple cert secret — without it the app is unsigned (Gatekeeper warns) but still
      # builds. The updater `.sig` (minisign) is independent of Apple signing. ──────────────────────
      - name: Build (Tauri .app)
        if: matrix.supported && runner.os == 'macOS'
        working-directory: apps/tv-tauri
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          # Intel row cross-compiles on the arm64 runner — install the target first. Empty → native.
          if [ -n "$TARGET" ]; then rustup target add "$TARGET"; fi
          pnpm exec tauri build --bundles app ${TARGET:+--target "$TARGET"}

      - name: Bundle libmpv dylibs into the .app
        if: matrix.supported && runner.os == 'macOS'
        working-directory: apps/tv-tauri
        shell: bash
        run: |
          set -euo pipefail
          # With `--target`, Tauri emits under target/<triple>/release/bundle; native builds under target/release/bundle.
          TARGET="${{ matrix.target }}"
          BASE="src-tauri/target${TARGET:+/$TARGET}/release/bundle"
          APP="$(find "$BASE/macos" -maxdepth 1 -name '*.app' | head -1)"
          [ -n "$APP" ] || { echo "no .app built"; exit 1; }
          echo "app: $APP"
          FW="$APP/Contents/Frameworks"; mkdir -p "$FW"
          # -RL dereferences the libmpv.dylib dev-symlink into a real file; we ship the versioned soname
          # (libmpv.2.dylib) and drop the bare libmpv.dylib dup so there's one copy.
          cp -RL "src-tauri/vendor/libmpv/${{ matrix.libmpv }}/lib/"*.dylib "$FW/" 2>/dev/null || true
          MPVSONAME="$(cd "$FW" && ls libmpv.*.dylib 2>/dev/null | grep -v '^libmpv\.dylib$' | head -1)"
          [ -n "$MPVSONAME" ] || { echo "no libmpv soname in Frameworks"; ls "$FW"; exit 1; }
          rm -f "$FW/libmpv.dylib"
          for d in "$FW"/*.dylib; do
            [ -e "$d" ] || continue
            b="$(basename "$d")"
            install_name_tool -id "@rpath/$b" "$d" 2>/dev/null || true
            install_name_tool -add_rpath "@loader_path" "$d" 2>/dev/null || true
            otool -L "$d" | tail -n +2 | awk '{print $1}' | while read -r dep; do
              case "$dep" in /System/*|/usr/lib/*|@rpath/*|@loader_path/*|@executable_path/*) ;; \
                *) install_name_tool -change "$dep" "@rpath/$(basename "$dep")" "$d" 2>/dev/null || true ;; esac
            done
          done
          # Find the ACTUAL Mach-O main binary — its name may differ from the .app basename and can
          # contain a space ("Airwave Client"), so don't derive it via basename; just take the file.
          BIN="$(find "$APP/Contents/MacOS" -maxdepth 1 -type f | head -1)"
          [ -n "$BIN" ] || { echo "no main binary"; ls -la "$APP/Contents/MacOS"; exit 1; }
          echo "binary: $BIN"
          # CRASH FIX: point the binary's libmpv dependency at the soname file we actually SHIP
          # (@rpath/libmpv.2.dylib). It's recorded as `libmpv.dylib` (linked via the dev symlink), and the
          # old code left it as @rpath/libmpv.dylib while we ship only libmpv.2.dylib → dyld "Library not
          # loaded" at launch. Rewrite whatever the current libmpv ref is to the real soname.
          CUR="$(otool -L "$BIN" | tail -n +2 | awk '{print $1}' | grep -i libmpv | head -1 || true)"
          if [ -n "$CUR" ] && [ "$CUR" != "@rpath/$MPVSONAME" ]; then
            install_name_tool -change "$CUR" "@rpath/$MPVSONAME" "$BIN" 2>/dev/null || true
          fi
          echo "== binary libmpv refs =="; otool -L "$BIN" | grep -i libmpv || true
          # Ship the MoltenVK Vulkan ICD manifest so mpv's gpu-context=moltenvk can find the driver at
          # runtime (the app sets VK_ICD_FILENAMES to this). Its library_path is the bare
          # "libMoltenVK.dylib", resolved via libvulkan's @loader_path rpath into Frameworks/.
          ICD="src-tauri/vendor/libmpv/${{ matrix.libmpv }}/lib/MoltenVK_icd.json"
          if [ -f "$ICD" ]; then
            mkdir -p "$APP/Contents/Resources/vulkan/icd.d"
            cp "$ICD" "$APP/Contents/Resources/vulkan/icd.d/"
            echo "bundled MoltenVK_icd.json"
          else
            echo "WARN: MoltenVK_icd.json not in vendor lib — macOS video will not render"; ls "$(dirname "$ICD")"
          fi
          echo "== Frameworks =="; ls "$FW"

      # Developer-ID sign (hardened runtime) — AFTER the dylib surgery (which changes the Mach-O content,
      # so any earlier signature would be invalid). Imports the cert into a throwaway keychain on the
      # ephemeral runner (mirrors desktop-release.yml), then signs leaf-first: every Framework dylib, the
      # main binary, then the bundle — with our entitlements. Gated on the cert secret; unsigned otherwise.
      - name: Sign macOS app (Developer ID + hardened runtime)
        if: matrix.supported && runner.os == 'macOS' && env.MAC_SIGN_AVAILABLE == 'true'
        working-directory: apps/tv-tauri
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          BASE="src-tauri/target${TARGET:+/$TARGET}/release/bundle"
          APP="$(find "$BASE/macos" -maxdepth 1 -name '*.app' | head -1)"
          KEYCHAIN="$RUNNER_TEMP/airwave-signing.keychain-db"
          KPW="$(openssl rand -base64 24)"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          [ -n "$IDENTITY" ] || { echo "no Developer ID Application identity"; exit 1; }
          echo "signing identity: $IDENTITY"
          ENT="src-tauri/entitlements.plist"
          # Leaf-first: dylibs, then the main binary, then the bundle.
          find "$APP/Contents/Frameworks" -name '*.dylib' -print0 | while IFS= read -r -d '' d; do
            codesign --force --timestamp --options runtime -s "$IDENTITY" "$d"
          done
          BIN="$(find "$APP/Contents/MacOS" -maxdepth 1 -type f | head -1)"
          codesign --force --timestamp --options runtime --entitlements "$ENT" -s "$IDENTITY" "$BIN"
          codesign --force --timestamp --options runtime --entitlements "$ENT" -s "$IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Create DMG from the bundled .app
        if: matrix.supported && runner.os == 'macOS'
        working-directory: apps/tv-tauri
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          BASE="src-tauri/target${TARGET:+/$TARGET}/release/bundle"
          APP="$(find "$BASE/macos" -maxdepth 1 -name '*.app' | head -1)"
          VER="$(node -p "require('./package.json').version")"
          OUT=artifacts; mkdir -p "$OUT"
          DMG="$OUT/Airwave-Client_${VER}_${{ matrix.updaterarch }}.dmg"
          # Stage the .app + an /Applications symlink in a temp dir for a drag-to-install DMG.
          STAGE="$(mktemp -d)"; cp -R "$APP" "$STAGE/"; ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Airwave Client" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          ls -la "$OUT"

      # Notarize the DMG (contains the signed app) via the App Store Connect API key, then staple the
      # ticket to BOTH the DMG and the .app (so the updater's tar'd app also passes Gatekeeper offline).
      - name: Notarize + staple macOS (Developer ID)
        if: matrix.supported && runner.os == 'macOS' && env.MAC_SIGN_AVAILABLE == 'true'
        working-directory: apps/tv-tauri
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          BASE="src-tauri/target${TARGET:+/$TARGET}/release/bundle"
          APP="$(find "$BASE/macos" -maxdepth 1 -name '*.app' | head -1)"
          VER="$(node -p "require('./package.json').version")"
          DMG="artifacts/Airwave-Client_${VER}_${{ matrix.updaterarch }}.dmg"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit "$DMG" --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler staple "$APP"
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      # The updater artifact: tar the (signed, stapled) .app → `.app.tar.gz`, minisign it (the updater's
      # OWN signature — independent of Apple codesigning), and drop the fragment for the finalize merge.
      - name: Stage updater tarball + fragment (macOS)
        if: matrix.supported && runner.os == 'macOS'
        working-directory: apps/tv-tauri
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          BASE="src-tauri/target${TARGET:+/$TARGET}/release/bundle"
          APP="$(find "$BASE/macos" -maxdepth 1 -name '*.app' | head -1)"
          VER="$(node -p "require('./package.json').version")"
          ARCH="${{ matrix.updaterarch }}"
          OUT=artifacts; mkdir -p "$OUT"
          TAR="$OUT/Airwave-Client_${VER}_${ARCH}.app.tar.gz"
          # Tar just the .app (the updater extracts + swaps it). -C into its dir so the archive has no path prefix.
          tar czf "$TAR" -C "$(dirname "$APP")" "$(basename "$APP")"
          pnpm exec tauri signer sign -p "" "$TAR"
          export SIG="$(cat "$TAR.sig")"
          export URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/$(basename "$TAR")"
          node -e "
            const fs=require('fs');
            fs.writeFileSync('artifacts/frag-darwin-${ARCH}.json', JSON.stringify(
              {key:'darwin-${ARCH}', signature:process.env.SIG, url:process.env.URL}));
          "
          cat "artifacts/frag-darwin-${ARCH}.json"; echo
          ls -la "$OUT"

      - name: Upload build artifacts
        if: matrix.supported
        uses: actions/upload-artifact@v4
        with:
          name: airwave-client-${{ matrix.os }}-${{ matrix.arch }}
          path: apps/tv-tauri/artifacts/*
          if-no-files-found: warn

  # ── Finalize: merge every platform's updater fragment into ONE latest.json and attach all the
  # distributables to the release. Runs after ALL matrix builds (so every platform's signature is in
  # hand — a per-job latest.json would clobber the others). The merge + a latest.json inspection
  # artifact run on ANY dispatch; the release ATTACH only fires on a v* tag or a `release_tag` dispatch,
  # so a plain build never mutates a release. Inherits `contents: write` from the workflow. ───────────
  finalize:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Assemble latest.json + collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          # Gather the distributables + updater sigs (NOT the frag-*.json).
          find dl -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -exec cp {} release/ \;
          VER="$(node -p "require('./apps/tv-tauri/package.json').version")"
          export VER
          node -e '
            const fs=require("fs"), cp=require("child_process");
            const frags=cp.execSync("find dl -name \"frag-*.json\"").toString().trim().split("\n").filter(Boolean);
            const platforms={};
            for (const f of frags){ const j=JSON.parse(fs.readFileSync(f,"utf8")); platforms[j.key]={signature:j.signature,url:j.url}; }
            const m={version:process.env.VER, notes:"Airwave Client "+process.env.VER, pub_date:new Date().toISOString(), platforms};
            fs.writeFileSync("release/latest.json", JSON.stringify(m,null,2));
          '
          echo "== latest.json =="; cat release/latest.json
          echo "== release files =="; ls -la release
      - name: Upload merged latest.json (inspection)
        uses: actions/upload-artifact@v4
        with:
          name: airwave-client-latest-json
          path: release/latest.json
      # Attach ONLY on a real release (v* tag push or a `release_tag` dispatch) — never on a plain build.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: release/*
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
