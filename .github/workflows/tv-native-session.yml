name: Native TV session regression checks

on:
  pull_request:
    paths:
      - "apps/tv-native/**"
      - "packages/key-input/**"
      - "packages/mpv-player/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/tv-native-session.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter tv-native...
      - run: pnpm --filter tv-native test
      - run: pnpm --filter tv-native check-types

  user-defaults:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run the production UserDefaults store checks
        run: |
          swiftc apps/tv-native/modules/session-store/ios/PersistentSessionStore.swift \
            apps/tv-native/modules/session-store/tests/PersistentSessionStoreTests.swift \
            -o "$RUNNER_TEMP/airwave-session-tests"
          "$RUNNER_TEMP/airwave-session-tests"
