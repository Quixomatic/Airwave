name: Build libmpv (Linux)

# Airwave's own reproducible libmpv build (Linux x64 + arm64). Vanilla libmpv,
# adapted from FengZeng/mpv (GPL). Scripts in tools/libmpv/. Manual dispatch.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Architecture to build"
        required: true
        default: "x64"
        type: choice
        options:
          - all
          - x64
          - arm64

permissions:
  contents: write # publish the built libmpv as a Release asset (bypasses the artifact quota)

concurrency:
  group: libmpv-linux-${{ github.ref }}-${{ inputs.arch }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: tools/libmpv

jobs:
  linux-x64:
    if: ${{ inputs.arch == 'all' || inputs.arch == 'x64' }}
    name: Build libmpv (Linux / x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install apt dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git curl python3 meson ninja-build pkg-config patchelf nasm \
            libfreetype-dev libfribidi-dev liblcms2-dev libluajit-5.1-dev \
            libass-dev libopus-dev librubberband-dev \
            zlib1g-dev libbz2-dev liblzma-dev \
            libpipewire-0.3-dev libpulse-dev \
            libxss-dev libxpresent-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libarchive-dev libbluray-dev libcdio-paranoia-dev libdvdnav-dev \
            libzimg-dev libplacebo-dev libvulkan-dev
      - name: Install Meson
        run: |
          set -euo pipefail
          bash ./ensure-meson.sh
          echo "$GITHUB_WORKSPACE/tools/libmpv/vendor/meson-bin" >> "$GITHUB_PATH"
      - name: Download vanilla mpv source
        run: bash ./download.sh
      - name: Cache ffmpeg build (skips the ~20-30min compile on hit)
        uses: actions/cache@v4
        with:
          path: tools/libmpv/vendor/ffmpeg-build
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ env.MPV_TARGET_ARCH }}-n8.1-dav1d1.5.3-${{ hashFiles('tools/libmpv/build-ffmpeg.sh') }}
      - name: Build FFmpeg from source
        run: bash ./build-ffmpeg.sh
      - name: Build libmpv
        run: bash ./build-linux.sh
      - name: Package runtime
        run: bash ./package-linux-runtime.sh --pkg-name "libmpv-airwave-linux-x64"
      - name: Publish to GitHub Release (bypasses the artifact-storage quota)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="libmpv-latest"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Airwave libmpv builds" \
            --notes "Auto-updated libmpv runtime bundles (per platform/arch). Not a code release." \
            --prerelease --latest=false
          gh release upload "$TAG" libmpv-*.tar.gz libmpv-*.tar.gz.sha256 --clobber

  linux-arm64:
    if: ${{ inputs.arch == 'all' || inputs.arch == 'arm64' }}
    name: Build libmpv (Linux / arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install apt dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git curl python3 meson ninja-build pkg-config patchelf nasm \
            libfreetype-dev libfribidi-dev liblcms2-dev libluajit-5.1-dev \
            libass-dev libopus-dev librubberband-dev \
            zlib1g-dev libbz2-dev liblzma-dev \
            libpipewire-0.3-dev libpulse-dev \
            libxss-dev libxpresent-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libarchive-dev libbluray-dev libcdio-paranoia-dev libdvdnav-dev \
            libzimg-dev libplacebo-dev libvulkan-dev
      - name: Install Meson
        run: |
          set -euo pipefail
          bash ./ensure-meson.sh
          echo "$GITHUB_WORKSPACE/tools/libmpv/vendor/meson-bin" >> "$GITHUB_PATH"
      - name: Download vanilla mpv source
        run: bash ./download.sh
      - name: Cache ffmpeg build (skips the ~20-30min compile on hit)
        uses: actions/cache@v4
        with:
          path: tools/libmpv/vendor/ffmpeg-build
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ env.MPV_TARGET_ARCH }}-n8.1-dav1d1.5.3-${{ hashFiles('tools/libmpv/build-ffmpeg.sh') }}
      - name: Build FFmpeg from source
        run: bash ./build-ffmpeg.sh
      - name: Build libmpv
        run: bash ./build-linux.sh
      - name: Package runtime
        run: bash ./package-linux-runtime.sh --pkg-name "libmpv-airwave-linux-arm64"
      - name: Publish to GitHub Release (bypasses the artifact-storage quota)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="libmpv-latest"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Airwave libmpv builds" \
            --notes "Auto-updated libmpv runtime bundles (per platform/arch). Not a code release." \
            --prerelease --latest=false
          gh release upload "$TAG" libmpv-*.tar.gz libmpv-*.tar.gz.sha256 --clobber
