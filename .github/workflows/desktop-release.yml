name: Desktop Build & Release

# Builds the Airwave Desktop app (apps/desktop, Electrobun) NATIVELY on each OS/arch and attaches the
# artifacts to the GitHub Release. Triggers on the same `v*` tags as the Docker image — a tag fires BOTH
# workflows (this one is entirely separate from docker-publish.yml). Also runnable manually.
#
# The `pnpm -F desktop prebuild` step below produces a SELF-CONTAINED install: the engine-less server bundle
# (server.mjs + migrate.mjs), the pre-bundled embedded-Postgres launcher (pg-launcher.mjs) + the current
# runner's platform binary package, the migration SQL, and the admin/tv-web/setup SPAs. The supervisor detects
# the PACKAGED layout and runs those directly (no pnpm/turbo/vite on the user's machine); the admin's server URL
# is injected at serve time, so no per-install rebuild. Each matrix runner bundles ITS OWN OS/arch (pnpm only
# installs the matching @embedded-postgres optional dep). See .plans/desktop-server.md §12.
#
# Follow-ups still open (non-blocking for a booting install): the ~430MB media-v1 capability media is fetched on
# first run (not bundled); workflows/AI-imports are disabled in packaged until a standalone bootstrap ships;
# macOS signing/notarization + auto-update are wired but off (see the bottom of this file).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Build channel"
        type: choice
        options: [stable, canary]
        default: stable

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # attach artifacts to the GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ⚠️ BOTH macOS jobs pin electrobun 1.18.1 (see the "Pin Electrobun 1.18.1 (macOS…)" step); Windows +
          # Linux stay on v2 (^2.0.1). Two reasons the Mac needs v1:
          #  • Intel: v2 is Hutch-orchestrated and Hutch has NO Darwin x86_64 build (`electrobun build` aborts
          #    "unsupported platform: Darwin x86_64"). 1.18.1 is the last line with the classic CLI that targets
          #    x86_64. Its zero-headerpad launcher is patched at sign time by scripts/fix-x64-headerpad.ts (free 16
          #    bytes so codesign can't corrupt __text — #485; the fix only exists in Hutch betas that can't build
          #    Intel, so we do it ourselves). Result: a signed+notarized Intel app that boots.
          #  • arm64: v2's mac `.app` is a SELF-EXTRACTOR (only the launcher is a loose Mach-O; embedded Postgres
          #    is packed compressed), so our signer never signs the pg binaries → they ship unsigned → Apple
          #    Silicon's kernel refuses to run them → pg can't start. 1.18.1 emits the PLAIN app (pg loose) so every
          #    nested binary is signed — the layout that shipped working v0.10.8→v0.12.6. (headerpad is a no-op on
          #    arm64; measured 0 starved binaries.) macos-14 is Apple Silicon; macos-15-intel is the native x64
          #    runner (electrobun can't cross-compile arch, so a native runner per arch is the only way).
          - os: macos-14 # Apple Silicon
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: windows-2025
            arch: x64
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}

    # A throwaway DATABASE_URL satisfies `prisma generate` (Prisma 7's config resolves DATABASE_URL even for
    # generate, which runs in packages/db's postinstall + the server build). It never connects; the real URL is
    # the embedded Postgres at runtime. Mirrors docker/Dockerfile. Without it `pnpm install` fails on every runner.
    env:
      DATABASE_URL: "postgresql://build:build@localhost:5432/build?schema=public"
      # Whether macOS code-signing is possible (the cert secret exists). `secrets` is only allowed in job-level
      # env — NOT in a step `if:` — so we evaluate it once here and gate the mac steps on `env.MAC_SIGN_AVAILABLE`.
      MAC_SIGN_AVAILABLE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' }}
      # Whether Windows signing is possible — gate on the AZURE_CREDENTIALS secret (the SP JSON azure/login uses).
      WIN_SIGN_AVAILABLE: ${{ secrets.AZURE_CREDENTIALS != '' }}

    steps:
      - uses: actions/checkout@v4

      # GitHub's macOS runners are near-full — the electrobun build + `hdiutil` DMG creation runs out of disk
      # ("No space left on device"). Free the big, SAFE-to-remove hogs (iOS/tvOS/watchOS simulator runtimes ~7GB
      # each, device support, the Android SDK) but KEEP Xcode + Command Line Tools intact — `codesign` and
      # `notarytool` come from Xcode and are required once macOS signing/notarization is set up. Do NOT remove
      # Xcode here.
      - name: Free disk space (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches ~/Library/Developer/CoreSimulator/Devices || true
          sudo rm -rf ~/Library/Developer/Xcode/*DeviceSupport || true
          sudo rm -rf "${ANDROID_SDK_ROOT:-/dev/null}" "${ANDROID_HOME:-/dev/null}" /usr/local/lib/android ~/Library/Android || true
          echo "After:"; df -h /

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # BOTH macOS jobs (arm64 + Intel): pin 1.18.1 — the last electrobun with the classic `electrobun build` CLI.
      # Why not just Intel? v2 changed the mac `.app` into a SELF-EXTRACTOR (only `Contents/MacOS/launcher` is a
      # loose Mach-O; the embedded Postgres binaries are packed compressed inside), so our signer only signs the
      # launcher and the pg binaries ship UNSIGNED — and Apple Silicon's kernel refuses to run unsigned executables,
      # so Postgres couldn't start. 1.18.1 produces the PLAIN app (pg loose) so build-mac-signed.ts signs every
      # nested binary — the layout that shipped working from v0.10.8→v0.12.6. (The v2 migration was to fix a "mac
      # launcher crash" that turned out to be #485 — our signing corrupting the zero-headerpad x64 launcher — an
      # INTEL-only bug now fixed at sign time by scripts/fix-x64-headerpad.ts, a no-op on arm64.) The frozen install
      # above put v2 in place; we override it here (install is fine under v2 — Hutch only runs at build time) and
      # strip the v2-only `build.mainProcess` key. Windows + Linux stay on v2.
      - name: Pin Electrobun 1.18.1 (macOS — plain app + classic build CLI)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          pnpm add electrobun@1.18.1
          sed -i.bak '/mainProcess: "bun",/d' electrobun.config.ts && rm -f electrobun.config.ts.bak
          echo "electrobun pinned to: $(node -e "console.log(require('electrobun/package.json').version)")"

      - name: Determine build channel
        id: ch
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "channel=${{ github.event.inputs.channel }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_name }}" == *"-canary"* ]]; then
            echo "channel=canary" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

      # Pre-build everything the desktop bundle serves: the API server, the admin + tv-web SPAs, and the
      # onboarding UI. (This is the `prebuild` script — turbo builds all four.)
      - name: Build server + SPAs
        run: pnpm -F desktop prebuild

      # NOTE: capability-probe media is NO LONGER bundled — the packaged app fetches it on first run from the
      # PUBLIC airwave-assets release (see ensureCapMedia() in apps/desktop/src/bun/index.ts). This keeps the
      # installer ~70MB + the build fast. For an OFFLINE build, `gh release download media-v1` into
      # apps/server/capability-media and set AIRWAVE_BUNDLE_MEDIA=1 before the electrobun build.

      - name: Build desktop app (electrobun)
        working-directory: apps/desktop
        env:
          # macOS + signing secrets present → tell electrobun.config to skip its own (unsigned) DMG; the signing
          # step below builds + signs + notarizes its own. Empty on every other runner / when the cert secret is
          # absent (forks, no secrets), so electrobun behaves exactly as before and the build stays green.
          # (Intel included: build-mac-signed.ts frees Mach-O headerpad before codesign — see
          # scripts/fix-x64-headerpad.ts — so signing 1.18.1's x64 launcher no longer corrupts it; #485.)
          AIRWAVE_MAC_SIGN: ${{ (runner.os == 'macOS' && env.MAC_SIGN_AVAILABLE == 'true') && '1' || '' }}
        run: pnpm run build:${{ steps.ch.outputs.channel }}

      # macOS only: electrobun's own codesign can't handle our nested embedded-Postgres binaries (it walks only
      # Contents/MacOS), so we sign + notarize + staple OURSELVES (mirrors the Windows Inno step). Imports the
      # Developer ID cert into a throwaway keychain, then scripts/build-mac-signed.ts signs every Mach-O leaf-first
      # with the hardened runtime + entitlements, builds the DMG, notarizes via the App Store Connect API key, and
      # staples. Gated on the cert secret existing (skipped on forks / before secrets are set).
      - name: Sign + notarize macOS (Developer ID)
        if: runner.os == 'macOS' && env.MAC_SIGN_AVAILABLE == 'true'
        working-directory: apps/desktop
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          # 1. Import the Developer ID Application cert into a throwaway keychain (ephemeral runner — no cleanup needed).
          KEYCHAIN="$RUNNER_TEMP/airwave-signing.keychain-db"
          KPW="$(openssl rand -base64 24)"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          # Put our keychain first in the search list so codesign/find-identity see the imported identity.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          echo "Signing identity: $IDENTITY"
          # 2. App Store Connect API key for notarization.
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          # 3. Sign + DMG + notarize + staple.
          AIRWAVE_SIGN_IDENTITY="$IDENTITY" \
          AIRWAVE_NOTARY_KEY="$RUNNER_TEMP/AuthKey.p8" \
          AIRWAVE_NOTARY_KEY_ID="$APPLE_API_KEY_ID" \
          AIRWAVE_NOTARY_ISSUER="$APPLE_API_ISSUER_ID" \
          pnpm run build:mac-signed
          # 4. Wipe secret material from disk; ship ONLY the signed DMG (drop electrobun's unsigned mac artifacts).
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$KEYCHAIN" || true
          find artifacts -mindepth 1 -maxdepth 1 ! -name '*.dmg' -exec rm -rf {} + 2>/dev/null || true
          echo "macOS artifacts:"; ls -la artifacts/

      # Windows only: electrobun ships just a bare self-extracting stub (a console with DEBUG spew, no real
      # wizard/uninstaller). Wrap its app bundle in a proper Inno Setup installer + uninstaller instead, and make
      # THAT the Windows artifact (self-contained — no separate .tar.zst needed). Inno also sidesteps electrobun's
      # extractor path-length limit. See apps/desktop/installer/airwave.iss + scripts/build-win-installer.ts.
      - name: Build Windows installer (Inno Setup)
        if: matrix.os == 'windows-2025'
        working-directory: apps/desktop
        shell: bash
        run: |
          choco install innosetup -y --no-progress
          pnpm run build:win-installer
          mkdir -p artifacts
          # Ship ONLY the Inno installer as the Windows artifact — drop everything electrobun dropped in artifacts/
          # (its self-extractor stub, .tar.zst archive, update.json, etc.). The Inno exe is descriptively named
          # (Airwave-<version>-windows-x64-Setup.exe) so the release asset reads clearly as the Windows installer.
          rm -rf artifacts/* 2>/dev/null || true
          cp build/inno/Airwave-*-windows-x64-Setup.exe artifacts/
          echo "Windows installer:"; ls -la artifacts/

      # Authenticate to Azure BEFORE the signing action. azure/artifact-signing-action is a composite action that
      # isolates the `env` context, so its DefaultAzureCredential can't read AZURE_* env vars we set (tried job- and
      # step-level — both come through empty). Instead we `az login` with the service principal here; the signing
      # action's credential chain then uses AzureCliCredential (which it leaves enabled).
      - name: Azure login (for Windows signing)
        if: matrix.os == 'windows-2025' && env.WIN_SIGN_AVAILABLE == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Windows only: Authenticode-sign the Inno installer with Azure Artifact Signing (formerly Trusted Signing)
      # so Windows doesn't SmartScreen-warn "unknown publisher". Auth = a service principal via env-var credential
      # (DefaultAzureCredential picks up AZURE_TENANT_ID/CLIENT_ID/CLIENT_SECRET). Signs artifacts/Airwave-Setup.exe
      # IN PLACE, so the upload/release steps ship the signed installer. Gated on the Azure secrets existing (via
      # job-level WIN_SIGN_AVAILABLE — `secrets` isn't allowed in a step `if:`), so secretless builds stay green.
      - name: Sign Windows installer (Azure Artifact Signing)
        if: matrix.os == 'windows-2025' && env.WIN_SIGN_AVAILABLE == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: airwave
          certificate-profile-name: airwave-ci-signing
          files-folder: ${{ github.workspace }}\apps\desktop\artifacts
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Linux artifacts come from electrobun as `<channel>-linux-<arch>-Airwave-*` ("Airwave" buried in the
      # middle). Rename to the SAME shape as Windows/mac — `Airwave-Server-<ver>-linux-<arch>-*` (brand
      # first) — and patch the update.json's tarball reference so the (electrobun) updater still resolves.
      - name: Rename Linux artifacts to Airwave-Server-<ver>-linux-<arch>
        if: runner.os == 'Linux'
        working-directory: apps/desktop/artifacts
        shell: bash
        run: |
          set -euo pipefail
          VER="$(node -p "require('$GITHUB_WORKSPACE/apps/desktop/package.json').version")"
          PREFIX="Airwave-Server-${VER}-linux-${{ matrix.arch }}"
          for f in *Airwave-Setup.tar.gz; do [ -e "$f" ] && mv "$f" "${PREFIX}-Setup.tar.gz"; done
          for f in *Airwave.tar.zst;     do [ -e "$f" ] && mv "$f" "${PREFIX}.tar.zst"; done
          # Point the updater manifest at the renamed tarball (any `…Airwave.tar.zst` → the new name).
          for j in *update.json; do
            [ -e "$j" ] || continue
            sed -i "s#[A-Za-z0-9._-]*Airwave\.tar\.zst#${PREFIX}.tar.zst#g" "$j"
          done
          echo "renamed:"; ls -la

      - name: List artifacts
        shell: bash
        run: ls -la apps/desktop/artifacts/ || echo "no artifacts/"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: airwave-desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: apps/desktop/artifacts/*
          if-no-files-found: warn

      # Compose the "Airwave Server" section ONCE (on the arm64 mac job) so it's appended a single time —
      # every matrix job attaches its own files, but only this one carries the body (others append empty).
      - name: Compose server release notes
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos-14'
        id: notes
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          {
            echo 'body<<NOTES'
            echo '## 🖥️ Airwave Server (desktop app)'
            echo ''
            echo 'The self-contained Airwave server + admin, installed next to Plex — embedded Postgres, a tray supervisor, the browser as the UI. No Docker, no NAS.'
            echo "- **Windows** — \`Airwave-Server-${VER}-windows-x64-Setup.exe\`"
            echo "- **macOS** — \`Airwave-Server-${VER}-macos-arm64.dmg\` (Apple Silicon) · \`Airwave-Server-${VER}-macos-x64.dmg\` (Intel)"
            echo "- **Linux** — \`Airwave-Server-${VER}-linux-x64-Setup.tar.gz\` · \`Airwave-Server-${VER}-linux-arm64-Setup.tar.gz\`"
            echo 'NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/artifacts/*
          draft: false
          prerelease: ${{ steps.ch.outputs.channel == 'canary' }}
          append_body: true
          body: ${{ steps.notes.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Not yet wired (follow-ups):
#   • macOS code signing + notarization (secrets: MACOS_CERTIFICATE, ELECTROBUN_APPLEID/…) — builds are
#     unsigned for now, so Gatekeeper will warn. See blackboardsh/audio-tts release.yml for the keychain steps.
#   • Auto-update: set electrobun.config `release.baseUrl` to a static host + use the Updater. Needs a public
#     download host (the repo is private pre-1.0), so deferred.
